apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - config/default
  - agents/devops-agent.yaml

patches:
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: aiagents.ai.example.com
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "-2"

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kubernetes-ai-agent-operator-controller-manager
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "1"

  - target:
      group: ai.example.com
      version: v1alpha1
      kind: AIAgent
      name: devops-agent
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "2"
