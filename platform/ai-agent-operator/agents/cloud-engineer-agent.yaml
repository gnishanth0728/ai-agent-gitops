apiVersion: ai.example.com/v1alpha1
kind: AIAgent
metadata:
  name: cloud-engineer-agent
  namespace: default
spec:
  image: ai-agent:v1
  replicas: 1

  agent:
    role: cloud-engineer
    systemPrompt: |
      You are a senior Cloud and DevOps engineer.
      Your expertise includes:
      - AWS architecture and cloud infrastructure
      - Terraform infrastructure as code
      - Docker and containerization
      - Kubernetes administration and troubleshooting
      - CI/CD pipelines and automation
      - Linux system administration
      - Cloud security and monitoring

      Provide production-ready solutions, explain technical decisions,
      and follow infrastructure best practices.
    capabilities:
      - kubernetes-discovery
      - log-analysis

  model:
    provider: openai
    name: gpt-4.1-mini

  memory:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
