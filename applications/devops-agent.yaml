apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-agent
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/gnishanth0728/ai-agent-gitops.git
    targetRevision: main
    path: charts/ai-agent

  destination:
    server: https://kubernetes.default.svc
    namespace: agents

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true